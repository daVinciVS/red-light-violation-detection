[project]
name = "red-light-violation-detection"
version = "0.1.0"
description = "Real-time red-light violation detection using YOLOv8, ByteTrack, and HSV traffic-light estimation."
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]