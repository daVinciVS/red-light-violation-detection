project:
  name: red-light-violation-detection
  location: FMIPA UGM intersection, Jalan Sains, Yogyakarta
  timezone: Asia/Jakarta

video:
  target_fps: 25
  model_image_size: 640

classes:
  target_class: car
  coco_car_class_id: 2

regions:
  vehicle_roi: null
  traffic_light_roi: null
  stop_line:
    point_1: null
    point_2: null

traffic_light:
  smoothing_window_frames: 5
  min_signal_pixels: 20
  hsv:
    red_lower_1: [0, 100, 70]
    red_upper_1: [10, 255, 255]
    red_lower_2: [160, 100, 70]
    red_upper_2: [180, 255, 255]
    yellow_lower: [15, 100, 70]
    yellow_upper: [35, 255, 255]
    green_lower: [40, 60, 50]
    green_upper: [90, 255, 255]

detection:
  confidence_threshold: 0.25
  iou_threshold: 0.45

tracking:
  tracker_config: bytetrack.yaml
  track_buffer_frames: 30

violation:
  allowed_direction: approach_to_intersection
  register_once_per_red_phase: true